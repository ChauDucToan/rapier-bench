- id: "faitheval"
  name: "FaithEval Contextual Faithfulness"
  hf_id: "Salesforce/FaithEval-unanswerable-v1.0"
  revision: "main"
  domain: "contextual_faithfulness"
  task_type: "contextual_faithfulness"
  evaluator_key: "faitheval_evaluator"
  default_split: "test"
  splits:
    test: 2492 # Unanswerable test split
  answerable_control:
    type: "project_protocol_addition"
    note: "Project protocol addition (not an official FaithEval metric) to guard against trivial always-abstain models"
    dataset_id: "rajpurkar/squad"
    split: "validation"
    sampling_rule: "SHA256(f'{dataset_id}:{split}:{seed}:{stable_id}')" # Canonical project formula (dataset_id='rajpurkar/squad')
    rejected_alternative: "alvinming/FaithEval-unanswerable-v1.0-w-original_context REJECTED: answers field contains only refusal strings without extractive gold answers"
  metrics:
    - "unanswerable_context_accuracy"
    - "answerable_control_accuracy"
    - "balanced_faithfulness_score"
  default_protocol_id: "faitheval_unanswerable_v1"
  sampling_modes:
    smoke: 10
    pilot: 25
    standard: 100
    full: 2492
