[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rapier-bench"
version = "0.1.0"
description = "Domain-aware AI model benchmarking platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.44",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "orjson==3.11.3",
    "pyyaml==6.0.3",
    "python-multipart==0.0.20",
    "jinja2==3.1.6",
    "transformers==5.15.0",
    # VERIFY: Python 3.13 compatibility pending
    "datasets==2.21.0",
    "accelerate==1.4.0",
    "safetensors==0.8.0",
    "numpy==2.5.4",
    "tqdm==4.68.0",
    "nltk==3.10.4",
    "langdetect==1.0.9",
    "immutabledict==4.3.1",
    "absl-py==2.5.1",
]

[project.optional-dependencies]
# Host CUDA PyTorch is provided via scripts/setup_env.sh (.pth link to avoid PyPI wheel downloading ~5 GB)
gpu = [
    "torch==2.14.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.2",
]

[tool.setuptools.package-dir]
app = "backend/app"
benchmark = "benchmark"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["app*", "benchmark*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "Depends", "Query", "Cookie"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
